
name: Check VT-3 Schedule

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Person to search"
        required: false
        default: "Logan Bailey"
        type: string
      schedule_date:
        description: "Optional YYYY-MM-DD date (blank = tomorrow)"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests certifi cryptography pdfplumber

      - name: Download and parse schedule
        env:
          SEARCH_NAME: ${{ inputs.search_name || 'Logan Bailey' }}
          SCHEDULE_DATE: ${{ inputs.schedule_date || '' }}
        run: python fetch_schedule.py

      - name: Save complete schedule
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vt3-full-schedule
          path: schedule_output/
          if-no-files-found: warn
          retention-days: 30
