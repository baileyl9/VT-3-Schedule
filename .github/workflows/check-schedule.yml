
name: Check VT-3 Schedule

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Name to search"
        required: false
        default: "Logan Bailey"
        type: string

  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SEARCH_NAME: ${{ inputs.search_name || 'Logan Bailey' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests certifi cryptography pdfplumber

      - name: Download and parse schedule
        run: python fetch_schedule.py

      - name: Save extracted results
        uses: actions/upload-artifact@v4
        with:
          name: vt3-schedule-results
          path: schedule_results.json
          retention-days: 7
